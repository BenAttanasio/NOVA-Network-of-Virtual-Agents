<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Totems — Agent Summoner</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; image-rendering: pixelated; }
        body { background: #1a1625; font-family: 'Press Start 2P', monospace; overflow: hidden; min-height: 100vh; }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: linear-gradient(180deg, #2d1f3d 0%, #1a1625 50%, #0d0a12 100%);
            overflow: hidden;
        }

        #floor {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 60%;
            background: 
                repeating-linear-gradient(90deg, transparent 0px, transparent 47px, rgba(139, 92, 246, 0.1) 47px, rgba(139, 92, 246, 0.1) 48px),
                repeating-linear-gradient(0deg, transparent 0px, transparent 47px, rgba(139, 92, 246, 0.1) 47px, rgba(139, 92, 246, 0.1) 48px),
                linear-gradient(180deg, #2a1f3a 0%, #1a1428 100%);
            transform: perspective(500px) rotateX(45deg);
            transform-origin: bottom center;
        }

        .star { position: absolute; background: #fff; border-radius: 50%; animation: twinkle 2s ease-in-out infinite; }
        @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }

        #top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 50px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 3px solid #4a3f6b;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 100;
        }

        #top-bar-left, #top-bar-right { display: flex; align-items: center; gap: 12px; }
        #top-bar-center { position: absolute; left: 50%; transform: translateX(-50%); }

        .top-btn {
            width: 36px; height: 36px;
            border: 2px solid #4a3f6b;
            background: rgba(74, 63, 107, 0.3);
            border-radius: 6px;
            color: #a78bfa;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: all 0.1s;
        }
        .top-btn:hover { background: rgba(74, 63, 107, 0.6); border-color: #a78bfa; }
        .top-btn.active { background: rgba(139, 92, 246, 0.3); border-color: #a78bfa; }

        #doubloon-display {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            background: rgba(251, 191, 36, 0.1);
            border: 2px solid #92400e;
            border-radius: 6px;
        }
        #doubloon-display svg { width: 20px; height: 20px; }
        #doubloon-count { font-size: 12px; color: #fbbf24; min-width: 40px; }
        #doubloon-display.pulse { animation: doubloon-pulse 0.3s ease-out; }
        @keyframes doubloon-pulse { 50% { transform: scale(1.1); background: rgba(251, 191, 36, 0.3); } }

        #title h1 { font-size: 14px; color: #a78bfa; text-shadow: 2px 2px 0 #4a3f6b; letter-spacing: 2px; }

        #instructions {
            position: absolute;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 8px;
            color: #6b5b95;
            text-align: center;
            animation: pulse-text 2s ease-in-out infinite;
            z-index: 5;
        }
        @keyframes pulse-text { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        #inventory {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 16px;
            padding: 16px 24px;
            background: rgba(0, 0, 0, 0.8);
            border: 4px solid #4a3f6b;
            border-radius: 8px;
            z-index: 100;
        }

        .totem-slot {
            position: relative;
            width: 64px; height: 64px;
            background: rgba(74, 63, 107, 0.5);
            border: 3px solid #6b5b95;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .totem-slot:hover:not(.thrown) {
            transform: translateY(-4px);
            border-color: #a78bfa;
            box-shadow: 0 4px 0 #4a3f6b, 0 8px 20px rgba(167, 139, 250, 0.3);
        }
        .totem-slot.selected {
            transform: translateY(-8px);
            border-color: #fbbf24;
            box-shadow: 0 8px 0 #4a3f6b, 0 0 30px rgba(251, 191, 36, 0.5);
            animation: selected-bounce 0.5s ease-in-out infinite;
        }
        @keyframes selected-bounce { 0%, 100% { transform: translateY(-8px); } 50% { transform: translateY(-12px); } }

        .totem-slot.thrown { background: rgba(30, 20, 40, 0.8); }
        .totem-icon { width: 48px; height: 48px; }
        .totem-slot.thrown .totem-icon { opacity: 0.15; }

        .totem-name {
            position: absolute;
            top: calc(100% + 8px);
            left: 50%;
            transform: translateX(-50%);
            font-size: 7px;
            white-space: nowrap;
            text-shadow: 2px 2px 0 #000;
        }

        .totem-slot.flash { animation: slot-flash 0.3s ease-out; }
        @keyframes slot-flash { 50% { box-shadow: 0 0 30px 10px rgba(255, 255, 255, 0.6); } }

        #click-area { position: absolute; top: 60px; left: 10%; right: 10%; bottom: 25%; cursor: crosshair; z-index: 5; }
        #arena { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 50%; z-index: 20; pointer-events: none; }

        .landed-totem { position: absolute; width: 80px; display: flex; flex-direction: column; align-items: center; animation: totem-land 0.3s ease-out forwards; pointer-events: auto; }
        @keyframes totem-land { 0% { transform: scale(0) rotate(720deg); opacity: 0; } 60% { transform: scale(1.2) rotate(0deg); } 80% { transform: scale(0.9); } 100% { transform: scale(1); opacity: 1; } }

        .totem-sprite { width: 64px; height: 80px; animation: totem-idle 1s ease-in-out infinite; }
        @keyframes totem-idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

        .totem-shadow { width: 48px; height: 12px; background: rgba(0, 0, 0, 0.4); border-radius: 50%; margin-top: -8px; }

        .status-icon { position: absolute; top: -8px; right: -8px; width: 24px; height: 24px; border: 2px solid; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 12px; animation: status-pop 0.3s ease-out; }
        @keyframes status-pop { 0% { transform: scale(0); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }

        .jrpg-textbox { position: absolute; bottom: calc(100% + 16px); left: 50%; transform: translateX(-50%); width: 280px; background: #1a1428; border: 4px solid; border-radius: 4px; opacity: 0; animation: textbox-appear 0.3s ease-out forwards; z-index: 1000; pointer-events: auto; }
        @keyframes textbox-appear { 0% { opacity: 0; transform: translateX(-50%) scale(0.8) translateY(10px); } 100% { opacity: 1; transform: translateX(-50%) scale(1) translateY(0); } }

        .textbox-inner { padding: 12px; }
        .textbox-header { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 2px dashed rgba(255, 255, 255, 0.2); }
        .textbox-avatar { width: 24px; height: 24px; border-radius: 4px; border: 2px solid; flex-shrink: 0; }
        .textbox-name { font-size: 10px; text-shadow: 2px 2px 0 #000; }
        .textbox-role { font-size: 7px; color: rgba(255, 255, 255, 0.5); margin-left: auto; }
        .textbox-content { font-size: 8px; line-height: 1.8; color: #e0e0e0; min-height: 40px; }
        .typing-cursor { display: inline-block; width: 8px; height: 10px; background: #fff; animation: cursor-blink 0.5s step-end infinite; margin-left: 2px; vertical-align: middle; }
        @keyframes cursor-blink { 50% { opacity: 0; } }

        .textbox-footer { padding: 0 12px 12px 12px; }
        .expand-btn { display: block; width: 100%; padding: 10px 12px; background: rgba(139, 92, 246, 0.3); border: 2px solid rgba(139, 92, 246, 0.6); border-radius: 4px; color: #a78bfa; font-family: 'Press Start 2P', monospace; font-size: 8px; cursor: pointer; text-align: center; pointer-events: auto; z-index: 1001; }
        .expand-btn:hover { background: rgba(139, 92, 246, 0.5); border-color: #a78bfa; color: #fff; }

        #agent-detail-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 8, 15, 0.95); backdrop-filter: blur(10px); z-index: 500; opacity: 0; pointer-events: none; transition: opacity 0.3s; overflow-y: auto; }
        #agent-detail-panel.active { opacity: 1; pointer-events: auto; }
        .detail-container { max-width: 600px; margin: 0 auto; padding: 20px; }
        .detail-header { display: flex; align-items: center; gap: 16px; padding: 20px; background: rgba(0, 0, 0, 0.4); border: 3px solid #4a3f6b; border-radius: 8px; margin-bottom: 16px; }
        .detail-avatar { width: 64px; height: 64px; }
        .detail-info h2 { font-size: 16px; margin-bottom: 4px; }
        .detail-info p { font-size: 9px; color: rgba(255, 255, 255, 0.5); }
        .detail-close { margin-left: auto; width: 40px; height: 40px; background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 8px; color: #fff; font-size: 16px; cursor: pointer; }
        .detail-close:hover { background: rgba(255, 255, 255, 0.2); }
        .detail-card { background: rgba(0, 0, 0, 0.3); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 16px; margin-bottom: 12px; }
        .detail-card.highlight { border-color: rgba(139, 92, 246, 0.4); background: rgba(139, 92, 246, 0.1); }
        .detail-card.warning { border-color: rgba(239, 68, 68, 0.4); background: rgba(239, 68, 68, 0.1); }
        .detail-label { font-size: 8px; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
        .detail-value { font-size: 10px; color: rgba(255, 255, 255, 0.9); line-height: 1.6; }

        #chest-container { position: absolute; bottom: 140px; right: 40px; z-index: 90; cursor: pointer; }
        #chest-glow { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 140px; background: radial-gradient(circle, rgba(251, 191, 36, 0.3) 0%, transparent 70%); border-radius: 50%; animation: chest-glow-pulse 2s ease-in-out infinite; pointer-events: none; }
        @keyframes chest-glow-pulse { 0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; } 50% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; } }
        #chest { position: relative; width: 80px; height: 80px; transition: transform 0.1s; }
        #chest:hover { transform: scale(1.1); }
        #chest.opening { animation: chest-shake 0.3s ease-in-out; }
        @keyframes chest-shake { 25% { transform: rotate(-5deg) scale(1.1); } 75% { transform: rotate(5deg) scale(1.1); } }
        #chest.disabled { filter: grayscale(0.8) brightness(0.5); cursor: not-allowed; }
        #chest.disabled:hover { transform: none; }
        .chest-sparkle { position: absolute; width: 6px; height: 6px; background: #fbbf24; border-radius: 50%; animation: float-sparkle 3s ease-in-out infinite; pointer-events: none; }
        @keyframes float-sparkle { 0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; } 50% { transform: translateY(-10px) scale(1.2); opacity: 1; } }
        #chest-label { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 7px; color: #fbbf24; white-space: nowrap; animation: hint-pulse 1.5s ease-in-out infinite; }
        #chest.disabled ~ #chest-label { color: #666; animation: none; }
        @keyframes hint-pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

        .flying-totem { position: absolute; width: 32px; height: 32px; border-radius: 50%; pointer-events: none; z-index: 200; animation: totem-spin 0.3s linear infinite; }
        @keyframes totem-spin { to { transform: rotate(360deg); } }
        .returning-totem { position: fixed; pointer-events: none; z-index: 200; }
        .recall-sparkle, .flying-doubloon, .coin-burst { position: fixed; pointer-events: none; z-index: 300; }
        .recall-sparkle { width: 8px; height: 8px; border-radius: 50%; animation: sparkle-fade 0.4s ease-out forwards; }
        @keyframes sparkle-fade { to { opacity: 0; transform: scale(0); } }
        .flying-doubloon { width: 24px; height: 24px; }
        .coin-burst { width: 16px; height: 16px; animation: coin-burst-fly 0.6s ease-out forwards; }
        @keyframes coin-burst-fly { to { transform: translate(var(--dx), var(--dy)) scale(0.5) rotate(360deg); opacity: 0; } }
        .dust-particle { position: absolute; width: 8px; height: 8px; border-radius: 2px; animation: dust-fly 0.5s ease-out forwards; pointer-events: none; }
        @keyframes dust-fly { to { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(0); } }
        .click-ripple { position: absolute; width: 40px; height: 40px; border: 3px solid #a78bfa; border-radius: 50%; animation: ripple-expand 0.5s ease-out forwards; pointer-events: none; }
        @keyframes ripple-expand { to { transform: translate(-50%, -50%) scale(2); opacity: 0; } }
        .summon-circle { position: absolute; width: 120px; height: 60px; border: 3px solid; border-radius: 50%; animation: summon-appear 0.5s ease-out forwards; pointer-events: none; }
        @keyframes summon-appear { 0% { opacity: 0; transform: translate(-50%, -50%) scale(0) rotateX(60deg); } 50% { opacity: 0.8; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5) rotateX(60deg); } }
        .doubloon-popup { position: fixed; font-size: 12px; color: #fbbf24; text-shadow: 2px 2px 0 #92400e; pointer-events: none; z-index: 400; animation: popup-float 1s ease-out forwards; }
        @keyframes popup-float { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-40px) scale(1.2); } }

        #settings-panel { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(8, 8, 15, 0.95); backdrop-filter: blur(10px); z-index: 600; opacity: 0; pointer-events: none; transition: opacity 0.3s; display: flex; align-items: center; justify-content: center; }
        #settings-panel.active { opacity: 1; pointer-events: auto; }
        .settings-container { width: 90%; max-width: 500px; background: rgba(0, 0, 0, 0.6); border: 3px solid #4a3f6b; border-radius: 12px; overflow: hidden; max-height: 90vh; overflow-y: auto; }
        .settings-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: rgba(74, 63, 107, 0.3); border-bottom: 2px solid #4a3f6b; }
        .settings-header h2 { font-size: 12px; color: #a78bfa; }
        .settings-body { padding: 20px; }
        .settings-label { font-size: 9px; color: rgba(255, 255, 255, 0.6); margin-bottom: 10px; display: block; }
        .settings-textarea { width: 100%; height: 120px; background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 12px; color: #fff; font-family: inherit; font-size: 9px; line-height: 1.6; resize: none; }
        .settings-textarea:focus { outline: none; border-color: #a78bfa; }
        .settings-footer { display: flex; gap: 12px; justify-content: flex-end; padding: 16px 20px; border-top: 2px solid rgba(255, 255, 255, 0.1); }
        .settings-btn { padding: 10px 20px; font-family: inherit; font-size: 9px; border-radius: 6px; cursor: pointer; transition: all 0.2s; }
        .settings-btn.primary { background: #8b5cf6; border: 2px solid #a78bfa; color: #fff; }
        .settings-btn.primary:hover { background: #a78bfa; }
        .settings-btn.secondary { background: transparent; border: 2px solid rgba(255, 255, 255, 0.2); color: rgba(255, 255, 255, 0.6); }
        .settings-btn.secondary:hover { border-color: rgba(255, 255, 255, 0.4); color: #fff; }

        .settings-section { margin-bottom: 20px; padding-bottom: 20px; border-bottom: 2px solid rgba(255, 255, 255, 0.1); }
        .settings-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .settings-section-title { font-size: 10px; color: #fbbf24; margin-bottom: 12px; }
        .settings-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
        .settings-row:last-child { margin-bottom: 0; }
        .settings-row-label { font-size: 8px; color: rgba(255, 255, 255, 0.7); }
        .settings-input { width: 100px; padding: 8px; background: rgba(0, 0, 0, 0.4); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 6px; color: #fff; font-family: inherit; font-size: 10px; text-align: center; }
        .settings-input:focus { outline: none; border-color: #a78bfa; }
        .settings-toggle { position: relative; width: 50px; height: 26px; background: rgba(255, 255, 255, 0.1); border-radius: 13px; cursor: pointer; transition: background 0.2s; }
        .settings-toggle.active { background: rgba(16, 185, 129, 0.5); }
        .settings-toggle::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; background: #fff; border-radius: 50%; transition: transform 0.2s; }
        .settings-toggle.active::after { transform: translateX(24px); }
        .dev-badge { font-size: 7px; color: #10b981; background: rgba(16, 185, 129, 0.2); padding: 2px 6px; border-radius: 4px; margin-left: 8px; }

        #console-panel { position: fixed; bottom: 130px; left: 20px; width: 320px; height: 150px; background: rgba(0, 0, 0, 0.95); border: 3px solid #4a3f6b; border-radius: 8px; z-index: 150; opacity: 0; pointer-events: none; transform: translateY(10px); transition: all 0.3s ease; display: flex; flex-direction: column; }
        #console-panel.active { opacity: 1; pointer-events: auto; transform: translateY(0); }
        .console-header { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; background: rgba(74, 63, 107, 0.3); border-bottom: 2px solid #4a3f6b; flex-shrink: 0; }
        .console-header span { font-size: 8px; color: #10b981; }
        .console-close { background: none; border: none; color: rgba(255, 255, 255, 0.5); cursor: pointer; font-size: 12px; padding: 2px 6px; }
        .console-close:hover { color: #fff; }
        .console-body { flex: 1; overflow-y: auto; padding: 8px 12px; font-size: 7px; line-height: 1.8; }
        .console-line { color: rgba(255, 255, 255, 0.7); margin-bottom: 2px; word-break: break-all; }
        .console-line.info { color: #60a5fa; }
        .console-line.success { color: #34d399; }
        .console-line.error { color: #f87171; }
        .console-line.warning { color: #fbbf24; }
        .console-time { color: rgba(255, 255, 255, 0.3); margin-right: 6px; }

        .error-toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: rgba(239, 68, 68, 0.9); border: 2px solid #f87171; border-radius: 8px; padding: 12px 20px; font-size: 9px; color: #fff; z-index: 700; animation: toast-appear 0.3s ease-out, toast-disappear 0.3s ease-in 2.7s forwards; }
        @keyframes toast-appear { from { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
        @keyframes toast-disappear { to { opacity: 0; transform: translateX(-50%) translateY(-20px); } }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="stars"></div>
        <div id="floor"></div>
        <div id="top-bar">
            <div id="top-bar-left">
                <button class="top-btn" id="sound-btn" title="Toggle Sound">🔊</button>
                <button class="top-btn" id="console-btn" title="Toggle Console">📟</button>
            </div>
            <div id="top-bar-center"><div id="title"><h1>NOVA TOTEMS</h1></div></div>
            <div id="top-bar-right">
                <div id="doubloon-display">
                    <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#fbbf24"/><circle cx="8" cy="8" r="5.5" fill="#f59e0b"/><circle cx="8" cy="8" r="4" fill="#fbbf24"/><text x="8" y="11" text-anchor="middle" font-size="7" font-weight="bold" fill="#92400e">$</text></svg>
                    <span id="doubloon-count">0</span>
                </div>
                <button class="top-btn" id="settings-btn" title="Master Steering">⚙️</button>
                <button class="top-btn" id="recall-btn" title="Recall All">↩️</button>
            </div>
        </div>
        <div id="instructions">[ SELECT A TOTEM BELOW, THEN CLICK TO SUMMON ]</div>
        <div id="click-area"></div>
        <div id="arena"></div>
        <div id="chest-container">
            <div id="chest-glow"></div>
            <div id="chest">
                <svg width="80" height="80" viewBox="0 0 20 20"><rect x="2" y="8" width="16" height="10" rx="2" fill="#8B4513"/><rect x="3" y="9" width="14" height="8" rx="1" fill="#A0522D"/><rect x="4" y="10" width="12" height="5" fill="#CD853F"/><rect x="5" y="11" width="3" height="3" fill="#1a1428"/><rect x="12" y="11" width="3" height="3" fill="#1a1428"/><rect x="5" y="11" width="1" height="1" fill="#fff"/><rect x="12" y="11" width="1" height="1" fill="#fff"/><rect x="8" y="13" width="4" height="1" fill="#1a1428"/><rect x="7" y="12" width="1" height="1" fill="#1a1428"/><rect x="12" y="12" width="1" height="1" fill="#1a1428"/><rect x="1" y="5" width="18" height="4" rx="1" fill="#8B4513"/><rect x="2" y="6" width="16" height="2" fill="#CD853F"/><rect x="8" y="3" width="4" height="3" fill="#fbbf24"/><rect x="7" y="4" width="1" height="2" fill="#fbbf24"/><rect x="12" y="4" width="1" height="2" fill="#fbbf24"/><rect x="9" y="2" width="2" height="1" fill="#fbbf24"/><rect x="8" y="7" width="4" height="3" fill="#fbbf24"/><rect x="9" y="8" width="2" height="1" fill="#92400e"/><rect x="4" y="14" width="2" height="1" fill="#f87171" opacity="0.5"/><rect x="14" y="14" width="2" height="1" fill="#f87171" opacity="0.5"/></svg>
            </div>
            <div id="chest-label">DAILY REWARD!</div>
        </div>
        <div id="inventory"></div>
    </div>

    <div id="settings-panel">
        <div class="settings-container">
            <div class="settings-header"><h2>⚙️ SETTINGS</h2><button class="top-btn" id="settings-close">✕</button></div>
            <div class="settings-body">
                <div class="settings-section">
                    <div class="settings-section-title">🎮 DEV MODE</div>
                    <div class="settings-row">
                        <span class="settings-row-label">Fast Chest (1 sec cooldown)<span class="dev-badge">DEV</span></span>
                        <div class="settings-toggle" id="fast-chest-toggle"></div>
                    </div>
                    <div class="settings-row">
                        <span class="settings-row-label">Set Doubloons<span class="dev-badge">DEV</span></span>
                        <input type="number" class="settings-input" id="doubloon-override" min="0" placeholder="0">
                    </div>
                    <div class="settings-row">
                        <span></span>
                        <button class="settings-btn primary" id="apply-doubloons" style="padding: 6px 12px; font-size: 8px;">Apply</button>
                    </div>
                </div>
                <div class="settings-section">
                    <div class="settings-section-title">📡 MASTER STEERING</div>
                    <label class="settings-label">INSTRUCTIONS FOR ALL AGENTS</label>
                    <textarea class="settings-textarea" id="steering-input" placeholder="Enter global instructions..."></textarea>
                </div>
            </div>
            <div class="settings-footer">
                <button class="settings-btn secondary" id="settings-cancel">Cancel</button>
                <button class="settings-btn primary" id="settings-save">💾 Save</button>
            </div>
        </div>
    </div>

    <div id="agent-detail-panel"><div class="detail-container" id="detail-content"></div></div>

    <div id="console-panel">
        <div class="console-header"><span>📟 NOVA CONSOLE</span><button class="console-close" id="console-close">✕</button></div>
        <div class="console-body" id="console-body"></div>
    </div>

    <script>
        // Sound
        class Sound {
            constructor() { this.ctx = null; this.on = true; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            tone(f, t, d, v=0.3) {
                if (!this.on || !this.ctx) return;
                const o = this.ctx.createOscillator(), g = this.ctx.createGain();
                o.type = t; o.frequency.setValueAtTime(f, this.ctx.currentTime);
                g.gain.setValueAtTime(v, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
                o.connect(g); g.connect(this.ctx.destination); o.start(); o.stop(this.ctx.currentTime + d);
            }
            select() { this.init(); [400,600,800].forEach((f,i)=>setTimeout(()=>this.tone(f,'square',0.08,0.15),i*30)); }
            throw() { this.init(); const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(300,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(100,this.ctx.currentTime+0.4); g.gain.setValueAtTime(0.2,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.4); o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+0.4); }
            land() { this.init(); this.tone(80,'sine',0.15,0.4); setTimeout(()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>{this.tone(f,'sine',0.2,0.15);this.tone(f*1.5,'triangle',0.15,0.08);},i*50)),50); }
            blip() { this.init(); this.tone(800,'square',0.03,0.08); }
            recallStart() { this.init(); [1047,784,659,523].forEach((f,i)=>setTimeout(()=>this.tone(f,'sine',0.15,0.12),i*60)); }
            whoosh() { this.init(); const o=this.ctx.createOscillator(),g=this.ctx.createGain(); o.type='sine'; o.frequency.setValueAtTime(150,this.ctx.currentTime); o.frequency.exponentialRampToValueAtTime(600,this.ctx.currentTime+0.25); g.gain.setValueAtTime(0.15,this.ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+0.25); o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+0.25); }
            slotReturn() { this.init(); this.tone(600,'square',0.05,0.2); setTimeout(()=>this.tone(900,'square',0.08,0.15),30); }
            complete() { this.init(); [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>{this.tone(f,'square',0.2,0.12);this.tone(f*0.5,'triangle',0.25,0.08);},i*80)); }
            chest() { this.init(); this.tone(150,'sawtooth',0.15,0.15); setTimeout(()=>[392,523,659,784,1047].forEach((f,i)=>setTimeout(()=>{this.tone(f,'sine',0.3,0.12);this.tone(f*2,'triangle',0.2,0.06);},i*40)),150); }
            coin() { this.init(); this.tone(1200,'square',0.08,0.12); setTimeout(()=>this.tone(1600,'square',0.1,0.1),50); }
            error() { this.init(); this.tone(200,'square',0.15,0.2); setTimeout(()=>this.tone(150,'square',0.2,0.15),100); }
            toggle() { this.on = !this.on; return this.on; }
        }
        const sound = new Sound();

        // Console
        const log = { lines: [], add(m,t='info') { const time=new Date().toLocaleTimeString('en-US',{hour12:false,hour:'2-digit',minute:'2-digit',second:'2-digit'}); this.lines.push({time,m,t}); if(this.lines.length>50)this.lines.shift(); document.getElementById('console-body').innerHTML=this.lines.map(l=>`<div class="console-line ${l.t}"><span class="console-time">${l.time}</span>${l.m}</div>`).join(''); document.getElementById('console-body').scrollTop=99999; }};

        // Data
        const agents = [
            {id:'astra',name:'ASTRA',role:'Visionary',color:'#8b5cf6',mood:'curious',icon:'💡',focus:"Trend Analysis",thought:"The patterns are converging...",bottleneck:"Waiting on market data",action:"Implement predictive caching",deliverable:"Q1 Dashboard",beliefs:"Patterns reveal truth."},
            {id:'sol',name:'SOL',role:'Strategist',color:'#f59e0b',mood:'focused',icon:'⚡',focus:"Strategy",thought:"ROI calculations complete.",bottleneck:"Cross-team alignment",action:"Schedule strategy sync",deliverable:"Roadmap v2.0",beliefs:"Strategy without execution is hallucination."},
            {id:'vega',name:'VEGA',role:'Architect',color:'#10b981',mood:'optimistic',icon:'🔧',focus:"Systems",thought:"Blueprints ready.",bottleneck:"Legacy integration",action:"Build adapter layer",deliverable:"Integration Framework",beliefs:"Elegant systems are invisible."},
            {id:'echo',name:'ECHO',role:'Creative',color:'#3b82f6',mood:'determined',icon:'✨',focus:"Communication",thought:"Words are weapons.",bottleneck:"Brand guidelines pending",action:"Create A/B framework",deliverable:"Content Engine",beliefs:"Every word carries weight."},
            {id:'orion',name:'ORION',role:'Analyst',color:'#ef4444',mood:'cautious',icon:'🔍',focus:"Research",thought:"Data verified.",bottleneck:"Data quality issues",action:"Validation pipeline",deliverable:"Intelligence Report",beliefs:"Facts don't lie."}
        ];

        let selected = null, thrown = new Set(), landed = [], recalling = false;
        let coins = parseInt(localStorage.getItem('doubloons')||'0');
        let lastChest = localStorage.getItem('lastChestOpen');
        let fastChestMode = localStorage.getItem('fastChestMode') === 'true';
        let chestCooldownEnd = 0;

        const darken=(c,p)=>{const n=parseInt(c.replace('#',''),16),a=Math.round(2.55*p);return '#'+(0x1000000+Math.max((n>>16)-a,0)*0x10000+Math.max((n>>8&0xFF)-a,0)*0x100+Math.max((n&0xFF)-a,0)).toString(16).slice(1);};
        const lighten=(c,p)=>{const n=parseInt(c.replace('#',''),16),a=Math.round(2.55*p);return '#'+(0x1000000+Math.min((n>>16)+a,255)*0x10000+Math.min((n>>8&0xFF)+a,255)*0x100+Math.min((n&0xFF)+a,255)).toString(16).slice(1);};

        function totemSVG(a,s=48) { return `<svg width="${s}" height="${s}" viewBox="0 0 16 16"><rect x="4" y="12" width="8" height="4" fill="${darken(a.color,30)}"/><rect x="5" y="12" width="6" height="1" fill="${a.color}"/><rect x="3" y="5" width="10" height="7" fill="${a.color}"/><rect x="4" y="4" width="8" height="1" fill="${a.color}"/><rect x="5" y="3" width="6" height="1" fill="${a.color}"/><rect x="4" y="6" width="8" height="5" fill="${lighten(a.color,20)}"/><rect x="5" y="7" width="2" height="2" fill="#1a1428"/><rect x="9" y="7" width="2" height="2" fill="#1a1428"/><rect x="5" y="7" width="1" height="1" fill="#fff"/><rect x="9" y="7" width="1" height="1" fill="#fff"/><rect x="6" y="10" width="4" height="1" fill="#1a1428"/><rect x="7" y="1" width="2" height="2" fill="${lighten(a.color,30)}"/><rect x="6" y="2" width="1" height="1" fill="${lighten(a.color,30)}"/><rect x="9" y="2" width="1" height="1" fill="${lighten(a.color,30)}"/><rect x="2" y="7" width="1" height="3" fill="${darken(a.color,20)}"/><rect x="13" y="7" width="1" height="3" fill="${darken(a.color,20)}"/></svg>`; }
        function bigSVG(a) { return `<svg width="64" height="80" viewBox="0 0 16 20"><rect x="2" y="16" width="12" height="4" fill="${darken(a.color,40)}"/><rect x="3" y="16" width="10" height="1" fill="${darken(a.color,20)}"/><rect x="3" y="6" width="10" height="10" fill="${a.color}"/><rect x="4" y="5" width="8" height="1" fill="${a.color}"/><rect x="5" y="4" width="6" height="1" fill="${a.color}"/><rect x="4" y="7" width="8" height="7" fill="${lighten(a.color,15)}"/><rect x="5" y="9" width="2" height="3" fill="#1a1428"/><rect x="9" y="9" width="2" height="3" fill="#1a1428"/><rect x="5" y="9" width="1" height="1" fill="#fff"/><rect x="9" y="9" width="1" height="1" fill="#fff"/><rect x="6" y="13" width="4" height="1" fill="#1a1428"/><rect x="6" y="1" width="4" height="3" fill="${lighten(a.color,30)}"/><rect x="5" y="2" width="1" height="2" fill="${lighten(a.color,30)}"/><rect x="10" y="2" width="1" height="2" fill="${lighten(a.color,30)}"/><rect x="7" y="0" width="2" height="1" fill="${lighten(a.color,40)}"/><rect x="1" y="8" width="2" height="5" fill="${darken(a.color,15)}"/><rect x="13" y="8" width="2" height="5" fill="${darken(a.color,15)}"/></svg>`; }
        function coinSVG(s=24) { return `<svg width="${s}" height="${s}" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="#fbbf24"/><circle cx="8" cy="8" r="5.5" fill="#f59e0b"/><circle cx="8" cy="8" r="4" fill="#fbbf24"/><text x="8" y="11" text-anchor="middle" font-size="7" font-weight="bold" fill="#92400e">$</text></svg>`; }

        function init() {
            for(let i=0;i<80;i++){const s=document.createElement('div');s.className='star';s.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*50}%;width:${Math.random()*3+1}px;height:${s.style.width};animation-delay:${Math.random()*2}s`;document.getElementById('stars').appendChild(s);}
            for(let i=0;i<5;i++){const s=document.createElement('div');s.className='chest-sparkle';s.style.cssText=`left:${20+Math.random()*40}px;top:${10+Math.random()*30}px;animation-delay:${Math.random()*2}s`;document.getElementById('chest-container').appendChild(s);}
            
            const inv = document.getElementById('inventory');
            agents.forEach(a => {
                const slot = document.createElement('div');
                slot.className = 'totem-slot';
                slot.id = 'slot-' + a.id;
                slot.innerHTML = `<div class="totem-icon">${totemSVG(a)}</div><div class="totem-name" style="color:${a.color}">${a.name}</div>`;
                slot.onclick = () => !recalling && !thrown.has(a.id) && selectSlot(a.id);
                inv.appendChild(slot);
            });

            updateCoins();
            updateFastChestToggle();
            checkChest();
            log.add('Nova Totems initialized','success');
            setTimeout(()=>{log.add('⚠️ No webhook','warning');log.add(`${agents.length} agents loaded`,'success');},800);
            setupEvents();
        }

        function selectSlot(id) {
            sound.select();
            document.querySelectorAll('.totem-slot').forEach(s=>s.classList.remove('selected'));
            document.getElementById('slot-'+id).classList.add('selected');
            selected = agents.find(a=>a.id===id);
            document.getElementById('instructions').textContent = `[ ${selected.name} SELECTED — CLICK TO SUMMON ]`;
            document.getElementById('instructions').style.color = selected.color;
        }

        function throwTotem(tx,ty) {
            if(!selected||thrown.has(selected.id)) return;
            const agent = selected;
            thrown.add(agent.id);
            sound.throw();

            const slot = document.getElementById('slot-'+agent.id);
            slot.classList.remove('selected');
            slot.classList.add('thrown');

            const fly = document.createElement('div');
            fly.className = 'flying-totem';
            fly.style.background = agent.color;
            fly.style.boxShadow = `0 0 20px ${agent.color}`;
            document.getElementById('game-container').appendChild(fly);

            const sr = slot.getBoundingClientRect();
            const sx=sr.left+sr.width/2, sy=sr.top;
            const start = Date.now();

            (function anim(){
                const p = Math.min((Date.now()-start)/600,1);
                fly.style.left = sx+(tx-sx)*p+'px';
                fly.style.top = sy+(ty-sy)*p-Math.sin(p*Math.PI)*200+'px';
                fly.style.transform = `rotate(${p*1080}deg) scale(${1+Math.sin(p*Math.PI)*0.5})`;
                if(p<1) requestAnimationFrame(anim);
                else { fly.remove(); land(agent,tx,ty); }
            })();

            selected = null;
            document.getElementById('instructions').textContent = '[ SELECT A TOTEM BELOW, THEN CLICK TO SUMMON ]';
            document.getElementById('instructions').style.color = '#6b5b95';
        }

        function land(agent,x,y) {
            sound.land();
            log.add(`${agent.name} summoned`,'success');
            addCoins(1,x,y-50);

            const arena = document.getElementById('arena');
            const ar = arena.getBoundingClientRect();

            const circle = document.createElement('div');
            circle.className = 'summon-circle';
            circle.style.cssText = `border-color:${agent.color};left:${x}px;top:${y}px`;
            document.getElementById('game-container').appendChild(circle);
            setTimeout(()=>circle.remove(),500);

            for(let i=0;i<8;i++){const d=document.createElement('div');d.className='dust-particle';const a=(i/8)*Math.PI*2;d.style.cssText=`--dx:${Math.cos(a)*40}px;--dy:${Math.sin(a)*40-20}px;left:${x}px;top:${y}px;background:${agent.color}`;document.getElementById('game-container').appendChild(d);setTimeout(()=>d.remove(),500);}

            const totem = document.createElement('div');
            totem.className = 'landed-totem';
            totem.id = 'landed-'+agent.id;
            totem.style.left = (x-ar.left-40)+'px';
            totem.style.top = (y-ar.top-60)+'px';
            totem.innerHTML = `<div class="totem-sprite">${bigSVG(agent)}</div><div class="totem-shadow"></div><div class="status-icon" style="border-color:${agent.color};background:linear-gradient(135deg,${agent.color},${agent.color}88)">${agent.icon}</div>`;
            arena.appendChild(totem);
            landed.push({agent,element:totem});

            setTimeout(()=>showTextBox(agent,totem),400);
        }

        function showTextBox(agent,totem) {
            sound.blip();
            const tb = document.createElement('div');
            tb.className = 'jrpg-textbox';
            tb.style.borderColor = agent.color;
            tb.innerHTML = `<div class="textbox-inner"><div class="textbox-header"><div class="textbox-avatar" style="background:${agent.color};border-color:${agent.color}">${totemSVG(agent,20)}</div><div class="textbox-name" style="color:${agent.color}">${agent.name}</div><div class="textbox-role">${agent.role}</div></div><div class="textbox-content"><span class="typed"></span><span class="typing-cursor"></span></div></div><div class="textbox-footer"><button class="expand-btn">📋 VIEW FULL STATUS</button></div>`;
            totem.appendChild(tb);

            const typed = tb.querySelector('.typed');
            const cursor = tb.querySelector('.typing-cursor');
            let i = 0;
            (function type(){
                if(i<agent.thought.length){typed.textContent+=agent.thought[i++];if(i%3===0)sound.blip();setTimeout(type,30+Math.random()*30);}
                else{cursor.style.display='none';const f=document.createElement('div');f.style.cssText=`margin-top:8px;padding-top:8px;border-top:2px dashed rgba(255,255,255,0.1);font-size:7px;color:${agent.color};opacity:0.7`;f.textContent=`📍 ${agent.focus}`;tb.querySelector('.textbox-content').appendChild(f);}
            })();

            tb.querySelector('.expand-btn').onmousedown = e => { e.preventDefault(); e.stopPropagation(); sound.select(); showDetail(agent); };
        }

        function showDetail(agent) {
            log.add(`Viewing ${agent.name}`,'info');
            const panel = document.getElementById('agent-detail-panel');
            document.getElementById('detail-content').innerHTML = `<div class="detail-header"><div class="detail-avatar">${totemSVG(agent,64)}</div><div class="detail-info"><h2 style="color:${agent.color}">${agent.name}</h2><p>${agent.role} • ${agent.mood} ${agent.icon}</p></div><button class="detail-close" id="detail-close">✕</button></div><div class="detail-card highlight"><div class="detail-label">📍 Focus</div><div class="detail-value">${agent.focus}</div></div><div class="detail-card warning"><div class="detail-label">🚧 Bottleneck</div><div class="detail-value">${agent.bottleneck}</div></div><div class="detail-card"><div class="detail-label">💭 Thought</div><div class="detail-value" style="font-style:italic">"${agent.thought}"</div></div><div class="detail-card"><div class="detail-label">⚡ Action</div><div class="detail-value">${agent.action}</div></div><div class="detail-card"><div class="detail-label">📦 Deliverable</div><div class="detail-value">${agent.deliverable}</div></div><div class="detail-card"><div class="detail-label">💎 Beliefs</div><div class="detail-value">${agent.beliefs}</div></div>`;
            panel.classList.add('active');
            document.getElementById('detail-close').onclick = () => panel.classList.remove('active');
        }

        function recall() {
            if(!landed.length||recalling) return;
            recalling = true;
            sound.recallStart();
            log.add('Recalling...','info');
            const toRecall = [...landed];
            landed = [];
            toRecall.forEach((item,idx)=>setTimeout(()=>recallOne(item,idx===toRecall.length-1),idx*200));
        }

        function recallOne(item,isLast) {
            const {agent,element} = item;
            const tr = element.getBoundingClientRect();
            const slot = document.getElementById('slot-'+agent.id);
            const sr = slot.getBoundingClientRect();

            const tb = element.querySelector('.jrpg-textbox');
            if(tb) tb.style.opacity = '0';

            const fly = document.createElement('div');
            fly.className = 'returning-totem';
            fly.innerHTML = totemSVG(agent,48);
            fly.style.cssText = `left:${tr.left+tr.width/2}px;top:${tr.top+tr.height/2}px;transform:translate(-50%,-50%)`;
            document.body.appendChild(fly);

            element.style.opacity = '0';
            sound.whoosh();

            const sx=tr.left+tr.width/2, sy=tr.top+tr.height/2;
            const ex=sr.left+sr.width/2, ey=sr.top+sr.height/2;
            const start = Date.now();

            (function anim(){
                const p = Math.min((Date.now()-start)/500,1);
                const e = 1-Math.pow(1-p,3);
                const x = sx+(ex-sx)*e;
                const y = sy+(ey-sy)*e - Math.sin(p*Math.PI)*80;
                fly.style.left = x+'px';
                fly.style.top = y+'px';
                fly.style.transform = `translate(-50%,-50%) scale(${1-e*0.3}) rotate(${(1-e)*360}deg)`;

                if(Math.random()<0.3){const sp=document.createElement('div');sp.className='recall-sparkle';sp.style.cssText=`left:${x+(Math.random()-0.5)*20}px;top:${y+(Math.random()-0.5)*20}px;background:${agent.color};box-shadow:0 0 6px ${agent.color}`;document.body.appendChild(sp);setTimeout(()=>sp.remove(),400);}

                if(p<1) requestAnimationFrame(anim);
                else {
                    fly.remove();
                    element.remove();
                    thrown.delete(agent.id);
                    slot.classList.remove('thrown','selected');
                    slot.innerHTML = `<div class="totem-icon">${totemSVG(agent)}</div><div class="totem-name" style="color:${agent.color}">${agent.name}</div>`;
                    slot.classList.add('flash');
                    sound.slotReturn();
                    setTimeout(()=>slot.classList.remove('flash'),300);

                    if(isLast){
                        setTimeout(()=>{
                            recalling = false;
                            sound.complete();
                            log.add('All recalled','success');
                            document.getElementById('instructions').textContent = '[ SELECT A TOTEM BELOW, THEN CLICK TO SUMMON ]';
                            document.getElementById('instructions').style.color = '#6b5b95';
                        },200);
                    }
                }
            })();
        }

        function updateCoins() { document.getElementById('doubloon-count').textContent = coins; }
        function setCoins(n) { coins = Math.max(0, parseInt(n) || 0); localStorage.setItem('doubloons', coins); updateCoins(); }
        function addCoins(n,x,y) {
            coins += n;
            localStorage.setItem('doubloons',coins);
            updateCoins();
            const d = document.getElementById('doubloon-display');
            d.classList.remove('pulse'); void d.offsetWidth; d.classList.add('pulse');
            const p = document.createElement('div');
            p.className = 'doubloon-popup';
            p.textContent = `+${n} 🪙`;
            p.style.cssText = `left:${x}px;top:${y}px`;
            document.body.appendChild(p);
            setTimeout(()=>p.remove(),1000);
            sound.coin();
        }

        function updateFastChestToggle() {
            const toggle = document.getElementById('fast-chest-toggle');
            if (fastChestMode) toggle.classList.add('active');
            else toggle.classList.remove('active');
        }

        function checkChest() {
            const chest = document.getElementById('chest');
            const label = document.getElementById('chest-label');
            
            if (fastChestMode) {
                // Fast mode: 1 second cooldown
                if (Date.now() < chestCooldownEnd) {
                    chest.classList.add('disabled');
                    label.textContent = 'WAIT 1 SEC...';
                } else {
                    chest.classList.remove('disabled');
                    label.textContent = 'FAST MODE! 🚀';
                }
            } else {
                // Normal mode: once per day
                const today = new Date().toDateString();
                if (lastChest === today) {
                    chest.classList.add('disabled');
                    label.textContent = 'COME BACK TOMORROW!';
                } else {
                    chest.classList.remove('disabled');
                    label.textContent = 'DAILY REWARD!';
                }
            }
        }

        function openChest() {
            const chest = document.getElementById('chest');
            if (chest.classList.contains('disabled')) return;

            if (fastChestMode) {
                chestCooldownEnd = Date.now() + 1000;
            } else {
                localStorage.setItem('lastChestOpen', new Date().toDateString());
                lastChest = new Date().toDateString();
            }

            chest.classList.add('opening');
            setTimeout(() => chest.classList.remove('opening'), 300);
            sound.chest();
            log.add('Chest opened!' + (fastChestMode ? ' (fast mode)' : ''), 'success');

            const reward = Math.floor(Math.random() * 10) + 5;
            const cr = chest.getBoundingClientRect();
            const cx = cr.left + cr.width / 2, cy = cr.top + cr.height / 2;

            for (let i = 0; i < 12; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'coin-burst';
                    c.innerHTML = coinSVG(16);
                    const a = (i / 12) * Math.PI * 2;
                    c.style.cssText = `--dx:${Math.cos(a)*50}px;--dy:${Math.sin(a)*50}px;left:${cx}px;top:${cy}px;position:fixed`;
                    document.body.appendChild(c);
                    setTimeout(() => c.remove(), 600);
                }, i * 25);
            }

            const counter = document.getElementById('doubloon-display').getBoundingClientRect();
            for (let i = 0; i < reward; i++) {
                setTimeout(() => {
                    const c = document.createElement('div');
                    c.className = 'flying-doubloon';
                    c.innerHTML = coinSVG(24);
                    c.style.cssText = `left:${cx}px;top:${cy}px`;
                    document.body.appendChild(c);
                    const start = Date.now();
                    (function anim() {
                        const p = Math.min((Date.now() - start) / 600, 1);
                        const e = 1 - Math.pow(1 - p, 2);
                        c.style.left = cx + (counter.left + 15 - cx) * e + 'px';
                        c.style.top = cy + (counter.top + 15 - cy) * e - Math.sin(p * Math.PI) * 50 + 'px';
                        c.style.transform = `rotate(${p*720}deg) scale(${1-p*0.5})`;
                        if (p < 1) requestAnimationFrame(anim);
                        else { c.remove(); addCoins(1, counter.left + counter.width / 2, counter.top); }
                    })();
                }, i * 80 + 300);
            }

            checkChest();
            
            // In fast mode, re-enable after 1 second
            if (fastChestMode) {
                setTimeout(checkChest, 1100);
            }
        }

        function showError(m) { sound.error(); const t=document.createElement('div');t.className='error-toast';t.textContent=`⚠️ ${m}`;document.body.appendChild(t);setTimeout(()=>t.remove(),3000); }

        function setupEvents() {
            document.getElementById('click-area').onclick = e => { if(!selected||recalling)return; const r=document.createElement('div');r.className='click-ripple';r.style.cssText=`left:${e.clientX}px;top:${e.clientY}px`;document.getElementById('game-container').appendChild(r);setTimeout(()=>r.remove(),500); throwTotem(e.clientX,e.clientY); };
            document.getElementById('recall-btn').onclick = recall;
            document.getElementById('chest-container').onclick = openChest;
            document.getElementById('sound-btn').onclick = () => { const on=sound.toggle(); document.getElementById('sound-btn').textContent=on?'🔊':'🔇'; if(on)sound.select(); };
            document.getElementById('console-btn').onclick = () => { document.getElementById('console-panel').classList.toggle('active'); document.getElementById('console-btn').classList.toggle('active'); };
            document.getElementById('console-close').onclick = () => { document.getElementById('console-panel').classList.remove('active'); document.getElementById('console-btn').classList.remove('active'); };
            document.getElementById('settings-btn').onclick = () => { document.getElementById('settings-panel').classList.add('active'); document.getElementById('doubloon-override').value = coins; };
            document.getElementById('settings-close').onclick = () => document.getElementById('settings-panel').classList.remove('active');
            document.getElementById('settings-cancel').onclick = () => document.getElementById('settings-panel').classList.remove('active');
            document.getElementById('settings-save').onclick = () => { localStorage.setItem('steeringInstructions',document.getElementById('steering-input').value); log.add('Saving...','info'); setTimeout(()=>{log.add('❌ Webhook not connected','error');showError('Saved locally only');document.getElementById('settings-panel').classList.remove('active');},500); };
            
            // Fast chest toggle
            document.getElementById('fast-chest-toggle').onclick = () => {
                fastChestMode = !fastChestMode;
                localStorage.setItem('fastChestMode', fastChestMode);
                updateFastChestToggle();
                checkChest();
                log.add(`Fast chest mode: ${fastChestMode ? 'ON' : 'OFF'}`, fastChestMode ? 'success' : 'info');
            };
            
            // Doubloon override
            document.getElementById('apply-doubloons').onclick = () => {
                const val = document.getElementById('doubloon-override').value;
                setCoins(val);
                log.add(`Doubloons set to ${coins}`, 'success');
                sound.coin();
            };
            
            document.onkeydown = e => { if(recalling)return; if(e.key>='1'&&e.key<='5'&&!thrown.has(agents[e.key-1].id))selectSlot(agents[e.key-1].id); if(e.key==='r'||e.key==='R')recall(); if(e.key==='Escape'){document.getElementById('settings-panel').classList.remove('active');document.getElementById('agent-detail-panel').classList.remove('active');} };
            document.onclick = () => sound.init();
        }

        init();
    </script>
</body>
</html>
